name: Filesystems CI

on:
  push:
    paths:
      - '.github/workflows/filesystems-ci.yml'
      - 'package/tools/filesystems/**'
  pull_request:
    paths:
      - '.github/workflows/filesystems-ci.yml'
      - 'package/tools/filesystems/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: filesystems-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        build_type:
          - Debug

    defaults:
      run:
        working-directory: package/tools/filesystems

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build-ci -DFILESYSTEMS_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build-ci --config ${{ matrix.build_type }} --parallel

      - name: Run watcher integration test
        run: >-
          ctest --test-dir build-ci
          -C ${{ matrix.build_type }}
          --output-on-failure
          --timeout 20
          -R "^watch_file_test$"

      - name: Run reader and edit integration tests
        run: >-
          ctest --test-dir build-ci
          -C ${{ matrix.build_type }}
          --output-on-failure
          --timeout 20
          -R "^(file_reader_test|file_edit_test)$"

      - name: Upload watcher binary
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: watcher-${{ matrix.os }}
          path: package/tools/filesystems/build-ci/**/watch_file*
          if-no-files-found: error

      - name: Upload edit binary
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: file-edit-${{ matrix.os }}
          path: package/tools/filesystems/build-ci/**/file_edit*
          if-no-files-found: error
