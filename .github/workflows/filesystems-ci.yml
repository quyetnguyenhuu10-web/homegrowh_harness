name: Filesystems CI

on:
  push:
    paths:
      - '.github/workflows/filesystems-ci.yml'
      - 'package/tools/filesystems/**'
  pull_request:
    paths:
      - '.github/workflows/filesystems-ci.yml'
      - 'package/tools/filesystems/**'
  workflow_dispatch:
    inputs:
      stress_profile:
        description: 'Stress profile to run'
        required: true
        default: standard
        type: choice
        options:
          - standard
          - extreme

permissions:
  contents: read

concurrency:
  group: filesystems-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  STRESS_PROFILE: ${{ inputs.stress_profile || 'standard' }}

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        build_type:
          - Debug

    defaults:
      run:
        working-directory: package/tools/filesystems

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build-ci
          -DFILESYSTEMS_BUILD_TESTS=ON
          -DFILESYSTEMS_READER_BLOCK_SIZE=4096
          -DFILESYSTEMS_EDIT_STREAM_CHUNK_SIZE=65536
          -DFILESYSTEMS_BUILD_LINUX_STRESS_TESTS=ON
          -DFILESYSTEMS_BUILD_WINDOWS_STRESS_TESTS=ON
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build-ci --config ${{ matrix.build_type }} --parallel

      - name: Run watcher integration test
        run: >-
          ctest --test-dir build-ci
          -C ${{ matrix.build_type }}
          --output-on-failure
          --timeout 20
          -R "^watch_file_test$"

      - name: Run reader and edit integration tests
        run: >-
          ctest --test-dir build-ci
          -C ${{ matrix.build_type }}
          --output-on-failure
          --timeout 20
          -R "^(file_reader_test|file_edit_test)$"

      - name: Run shared chunk matcher stress test
        run: >-
          ctest --test-dir build-ci
          -C ${{ matrix.build_type }}
          --output-on-failure
          --timeout 120
          -R "^chunk_matcher_stress_test$"

      - name: Run Linux edit stress suite
        if: matrix.os == 'ubuntu-latest'
        run: >-
          ctest --test-dir build-ci
          -C ${{ matrix.build_type }}
          --output-on-failure
          --timeout 1800
          -R "^linux_edit_stress_${{ env.STRESS_PROFILE }}_test$"

      - name: Run Windows edit stress suite
        if: matrix.os == 'windows-latest'
        run: >-
          ctest --test-dir build-ci
          -C ${{ matrix.build_type }}
          --output-on-failure
          --timeout 1800
          -R "^windows_edit_stress_${{ env.STRESS_PROFILE }}_test$"

      - name: Upload watcher binary
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: watcher-${{ matrix.os }}
          path: package/tools/filesystems/build-ci/**/watch_file*
          if-no-files-found: error

      - name: Upload edit binary
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: file-edit-${{ matrix.os }}
          path: package/tools/filesystems/build-ci/**/file_edit*
          if-no-files-found: error

      - name: Upload Linux edit stress results
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux-edit-stress-${{ env.STRESS_PROFILE }}
          path: |
            package/tools/filesystems/tests/platform/linux/fsystem/edit/linux_edit_stress/index.html
            package/tools/filesystems/tests/platform/linux/fsystem/edit/linux_edit_stress/**/report.html
            package/tools/filesystems/tests/platform/linux/fsystem/edit/linux_edit_stress/**/results/**
          if-no-files-found: warn

      - name: Upload Windows edit stress results
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-edit-stress-${{ env.STRESS_PROFILE }}
          path: |
            package/tools/filesystems/tests/platform/windows/fsystem/edit/windows_edit_stress/index.html
            package/tools/filesystems/tests/platform/windows/fsystem/edit/windows_edit_stress/**/report.html
            package/tools/filesystems/tests/platform/windows/fsystem/edit/windows_edit_stress/**/results/**
          if-no-files-found: warn
